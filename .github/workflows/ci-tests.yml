name: Continuous Integration - Unit & Integration Tests

on:
  pull_request:
    branches:
      - main
      - master
      - develop
  push:
    branches:
      - main
      - master

jobs:
  # -----------------------------------------------------------------
  # 1. Testes do Backend (NestJS + TypeORM)
  # -----------------------------------------------------------------
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm run test

  # -----------------------------------------------------------------
  # 2. Testes do AI-Agent (NestJS + Gemini SDK)
  # -----------------------------------------------------------------
  test-ai-agent:
    name: AI-Agent Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ai-agent/package-lock.json

      - name: Install dependencies
        working-directory: ./ai-agent
        run: npm ci

      - name: Run AI-Agent Tests
        working-directory: ./ai-agent
        run: npm run test
        env:
          GEMINI_API_KEY: 'test-dummy-key'
          BACKEND_URL: 'http://localhost:3000'

  # -----------------------------------------------------------------
  # 3. Testes do Frontend (Vitest + Coverage)
  # -----------------------------------------------------------------
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage-report
          path: frontend/coverage/