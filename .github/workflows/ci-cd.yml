name: BCB CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Validate OpenSpec
        run: |
          # Aqui rodaria um linter de OpenAPI/OpenSpec
          echo "Validating specification..."

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install & Test Backend
        run: |
          cd backend
          npm install
          npm run test

  build-and-push:
    needs: [validate-spec, backend-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build Backend Image
        run: docker build -t bcb-backend:latest -f infra/docker/backend.dev.Dockerfile .
