<div class="container mt-4">
  <div class="row">
    <!-- Sidebar / Profile -->
    <div class="col-md-4">
      <div class="card p-3 shadow-sm">
        <h4>{{ client?.name }}</h4>
        <p class="text-muted">{{ client?.identifier }}</p>
        <hr>
        <div *ngIf="client?.type === 'PRE_PAID'">
          <label>Saldo Disponível:</label>
          <h3 class="text-success">R$ {{ client?.balance | number:'1.2-2' }}</h3>
        </div>
        <div *ngIf="client?.type === 'POST_PAID'">
          <label>Limite Mensal:</label>
          <h3 class="text-primary">R$ {{ client?.limit | number:'1.2-2' }}</h3>
          <label>Consumido:</label>
          <p class="text-danger">R$ {{ client?.consumed | number:'1.2-2' }}</p>
        </div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <strong>Chat de Mensagens</strong>
        </div>
        <div class="card-body chat-window" style="height: 400px; overflow-y: auto;">
          <div *ngFor="let msg of messages" [ngClass]="{'text-end': true}">
            <div class="bubble d-inline-block p-2 m-2 rounded shadow-sm" 
                 [ngClass]="msg.urgency === 'URGENT' ? 'bg-warning' : 'bg-light'">
              <div>{{ msg.content }}</div>
              <small class="text-muted" style="font-size: 0.7rem;">
                {{ msg.urgency }} - {{ msg.status }}
              </small>
            </div>
          </div>
        </div>
        <div class="card-footer bg-white">
          <form (ngSubmit)="sendMessage()">
            <div class="input-group">
              <input type="text" [(ngModel)]="newMessage" name="content" class="form-control" placeholder="Digite sua mensagem...">
              <select [(ngModel)]="urgency" name="urgency" class="form-select" style="max-width: 120px;">
                <option value="NORMAL">Normal</option>
                <option value="URGENT">Urgente</option>
              </select>
              <button class="btn btn-primary" type="submit">Enviar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
